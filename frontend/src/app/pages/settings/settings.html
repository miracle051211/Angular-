<section class="feature-page settings-page">
  <section class="settings-grid">
    <form class="settings-panel settings-password" [formGroup]="securityForm" (ngSubmit)="updatePassword()">
      <h2>更改密码</h2>

      <label>
        当前密码
        <input formControlName="oldPassword" type="password" autocomplete="current-password" />
      </label>
      <label>
        新密码
        <input formControlName="newPassword" type="password" autocomplete="new-password" />
      </label>
      <label>
        确认新密码
        <input formControlName="confirmPassword" type="password" autocomplete="new-password" />
      </label>

      <button class="settings-submit" type="submit" [disabled]="isSavingPassword()">
        {{ isSavingPassword() ? '更新中...' : '更新密码' }}
      </button>
    </form>

    <form class="settings-panel settings-permissions" [formGroup]="settingsForm" (ngSubmit)="saveSettings()">
      <h2>安全权限</h2>

      <div class="permission-list">
        <label>
          <input type="checkbox" formControlName="notifyCommentReply" />
          <span>评论与回复通知</span>
        </label>
        <label>
          <input type="checkbox" formControlName="notifyNewMessage" />
          <span>私信通知</span>
        </label>
        <label>
          <input type="checkbox" formControlName="notifyPostLike" />
          <span>帖子点赞通知</span>
        </label>
        <label>
          <input type="checkbox" formControlName="notifyCommentLike" />
          <span>评论点赞通知</span>
        </label>
        <label>
          <input type="checkbox" formControlName="receiveEmailNotifications" />
          <span>邮件通知</span>
        </label>
      </div>

      <button class="settings-submit settings-submit--light" type="submit" [disabled]="isLoadingSettings() || isSavingSettings()">
        {{ isSavingSettings() ? '保存中...' : '保存权限' }}
      </button>
    </form>
  </section>
</section>
