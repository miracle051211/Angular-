<section class="feature-page">
  <a class="ghost-button back-link" routerLink="/messages">返回私信</a>

  <header class="feature-hero compose-hero">
    <div>
      <span class="feature-kicker">QUICK NOTE</span>
      <h1>把消息投进同学的信箱</h1>
      <p>适合从个人主页、课程讨论之外，快速发一封不打扰的小纸条。</p>
    </div>
  </header>

  <form class="ink-panel form-grid compose-form" [formGroup]="form" (ngSubmit)="send()">
    <label>
      收件人
      <input formControlName="receiver" placeholder="输入对方昵称或邮箱" />
      @if (form.controls.receiver.touched && form.controls.receiver.invalid) {
        <small>请填写收件人</small>
      }
    </label>
    <label>
      内容
      <textarea formControlName="body" maxlength="1200" placeholder="写下想发送的私信内容"></textarea>
      <small>{{ form.controls.body.value.length }}/1200</small>
    </label>
    <button class="ink-button" type="submit" [disabled]="form.invalid || isSubmitting()">
      {{ isSubmitting() ? '发送中...' : '发送私信' }}
    </button>
  </form>
</section>
