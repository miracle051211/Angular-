<section class="feature-page admin-list-page">
  <div class="admin-table-shell">
    <table class="admin-table">
      <thead>
        <tr>
          <th>用户</th>
          <th>邮箱</th>
          <th>角色</th>
          <th>帖子数</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users(); track user.id) {
          <tr>
            <td><a [routerLink]="['/profile', user.id]">{{ user.username }}</a></td>
            <td>{{ user.email }}</td>
            <td>{{ user.roleName ?? '普通用户' }}</td>
            <td>{{ user.postCount }}</td>
            <td>
              <span class="status-dot" [class.is-muted]="!user.active">
                {{ user.active ? '正常' : '禁用' }}
              </span>
            </td>
            <td>
              <button class="ghost-button" type="button" (click)="toggleUser(user.id)">
                {{ user.active ? '禁用' : '启用' }}
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
