<section class="creative-login" [class.is-registering]="isRegisterOpen()" [class.is-resetting]="isResetOpen()" (mousemove)="trackPointer($event)">
  <aside class="illustration-panel" aria-label="互动登录插画">
    <div class="panel-brand">
      <a class="brand-mark" routerLink="/home" aria-label="返回首页">
        <span class="brand-icon" aria-hidden="true">学</span>
        <span>学习小洞天</span>
      </a>
    </div>

    <div class="characters" aria-hidden="true">
      @if (isLoginSuccess()) {
        <div class="confetti-container">
          @for (piece of confettiPieces; track piece.style) {
            <span class="confetti-piece" [style]="piece.style"></span>
          }
        </div>
      }

      <div
        class="character purple-character entrance-ready"
        [class.character--success]="isLoginSuccess()"
        [class.character--failed]="isLoginFailed()"
        [style.height.px]="purpleHeight()"
        [style.transform]="purpleTransform()"
      >
        <div class="face purple-face" [style.left.px]="purpleFaceLeft()" [style.top.px]="purpleFaceTop()">
          @for (eye of [1, 2]; track eye) {
            <span class="eye white-eye purple-eye" [class.blinking]="isPurpleBlinking()">
              <span class="pupil purple-pupil" [style.transform]="purplePupilTransform()"></span>
            </span>
          }
        </div>
        <span
          class="mouth purple-mouth"
          [class.mouth--typing]="isTypingOrPasswordHidden() && !isLoginFailed() && !isLoginSuccess()"
          [class.mouth--sad]="isLoginFailed()"
          [class.mouth--happy]="isLoginSuccess()"
          [style.left.px]="purpleMouthLeft()"
          [style.top.px]="purpleMouthTop()"
          [style.--counter-skew]="purpleMouthCounterSkew()"
        ></span>
      </div>

      <div
        class="character black-character entrance-ready"
        [class.character--success]="isLoginSuccess()"
        [class.character--failed]="isLoginFailed()"
        [style.transform]="blackTransform()"
      >
        <div class="face black-face" [style.left.px]="blackFaceLeft()" [style.top.px]="blackFaceTop()">
          @for (eye of [1, 2]; track eye) {
            <span class="eye white-eye black-eye" [class.blinking]="isBlackBlinking()" [class.eye--sad]="isLoginFailed()">
              <span class="pupil black-pupil" [style.transform]="blackPupilTransform()"></span>
            </span>
          }
        </div>
      </div>

      <div class="character orange-character entrance-ready" [style.transform]="simpleBodyTransform()">
        <div class="face orange-face" [style.left.px]="orangeFaceLeft()" [style.top.px]="orangeFaceTop()">
          @for (eye of [1, 2]; track eye) {
            <span class="dot-eye" [class.blinking]="isOrangeBlinking()">
              <span class="pupil dot-pupil" [style.transform]="frontPupilTransform()"></span>
            </span>
          }
        </div>
        <span
          class="mouth orange-mouth"
          [class.mouth--typing]="isTypingOrPasswordHidden() && !isLoginFailed() && !isLoginSuccess()"
          [class.mouth--sad]="isLoginFailed()"
          [class.mouth--happy]="isLoginSuccess()"
          [style.left.px]="orangeMouthLeft()"
          [style.top.px]="orangeMouthTop()"
        ></span>
      </div>

      <div class="character yellow-character entrance-ready" [style.transform]="simpleBodyTransform()">
        <div class="face yellow-face" [style.left.px]="yellowFaceLeft()" [style.top.px]="yellowFaceTop()">
          @for (eye of [1, 2]; track eye) {
            <span class="dot-eye" [class.blinking]="isYellowBlinking()">
              <span class="pupil dot-pupil" [style.transform]="frontPupilTransform()"></span>
            </span>
          }
        </div>
        <span
          class="yellow-mouth"
          [class.yellow-mouth--sad]="isLoginFailed()"
          [class.yellow-mouth--happy]="isLoginSuccess()"
          [style.left.px]="yellowMouthLeft()"
          [style.top.px]="yellowMouthTop()"
        >
          <svg viewBox="0 0 80 20" aria-hidden="true">
            <path d="M0 10 Q10 10 20 10 Q30 10 40 10 Q50 10 60 10 Q70 10 80 10"></path>
          </svg>
        </span>
      </div>
    </div>

    <div class="panel-links" aria-label="辅助链接">
      <a href="#">GitHub</a>
      <a href="#">Gitee</a>
      <a routerLink="/home">回首页</a>
    </div>
  </aside>

  <section class="form-panel">
    <div
      class="auth-switch"
      [class.is-register]="isRegisterOpen()"
      [class.is-reset]="isResetOpen()"
      aria-label="账号操作切换"
    >
      <button
        type="button"
        class="auth-switch__button"
        [class.is-active]="!isRegisterOpen() && !isResetOpen()"
        [attr.aria-pressed]="!isRegisterOpen() && !isResetOpen()"
        (click)="showLogin()"
      >
        登录
      </button>
      <button
        type="button"
        class="auth-switch__button"
        [class.is-active]="isRegisterOpen()"
        [attr.aria-pressed]="isRegisterOpen()"
        (click)="openRegister()"
      >
        注册
      </button>
      <button
        type="button"
        class="auth-switch__button"
        [class.is-active]="isResetOpen()"
        [attr.aria-pressed]="isResetOpen()"
        (click)="openReset()"
      >
        找回
      </button>
    </div>

    <div class="mobile-brand">
      <a class="brand-mark" routerLink="/home" aria-label="返回首页">
        <span class="brand-icon" aria-hidden="true">学</span>
        <span>学习小洞天</span>
      </a>
    </div>

    <div class="login-layer" aria-hidden="{{ isRegisterOpen() }}">
      <div class="login-copy">
        <p class="eyebrow">登录</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label class="field-control">
          邮箱
          <input
            formControlName="email"
            type="email"
            autocomplete="email"
            placeholder="student@example.com"
            (focus)="focusEmail()"
            (blur)="blurEmail()"
          />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="field-error">请输入有效邮箱。</span>
          }
        </label>

        <label class="field-control">
          密码
          <span class="password-field">
            <input
              formControlName="password"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="current-password"
              placeholder="请输入至少 6 位密码"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? '隐藏密码' : '显示密码'"
            >
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                  <path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13 13 0 0 1-1.7 2.7" />
                  <path d="M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6" />
                  <path d="M2 2l20 20" />
                </svg>
              }
            </button>
          </span>
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <span class="field-error">密码至少需要 6 位。</span>
          }
        </label>

        <div class="form-row">
          <label class="remember-control">
            <input formControlName="remember" type="checkbox" />
            <span>记住我</span>
          </label>
        </div>

        <button class="submit-button" type="submit" [disabled]="isSubmitting()">
          <span>{{ isSubmitting() ? '登录中...' : '登录' }}</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>
      </form>

    </div>

    <div class="register-layer" aria-hidden="{{ !isRegisterOpen() }}">
      <div class="register-copy">
        <span>JOIN</span>
        <h2>注册</h2>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="submitRegister()" novalidate>
        <label class="field-control">
          用户名
          <input formControlName="username" autocomplete="nickname" placeholder="给自己取个名字" />
          @if (registerForm.controls.username.touched && registerForm.controls.username.invalid) {
            <span class="field-error">用户名至少 2 个字符。</span>
          }
        </label>

        <label class="field-control">
          邮箱
          <input formControlName="email" type="email" autocomplete="email" placeholder="student@example.com" />
          @if (registerForm.controls.email.touched && registerForm.controls.email.invalid) {
            <span class="field-error">请输入有效邮箱。</span>
          }
        </label>

        <label class="field-control captcha-control">
          邮箱验证码
          <span class="captcha-field">
            <input formControlName="captcha" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" />
            <button type="button" (click)="sendRegisterCaptcha()" [disabled]="isSendingRegisterCaptcha()">
              {{ isSendingRegisterCaptcha() ? '发送中...' : '发送验证码' }}
            </button>
          </span>
          @if (registerForm.controls.captcha.touched && registerForm.controls.captcha.invalid) {
            <span class="field-error">请输入 6 位验证码。</span>
          }
        </label>

        <label class="field-control">
          密码
          <input formControlName="password" type="password" autocomplete="new-password" placeholder="至少 6 位密码" />
          @if (registerForm.controls.password.touched && registerForm.controls.password.invalid) {
            <span class="field-error">密码至少需要 6 位。</span>
          }
        </label>

        <button class="submit-button register-submit" type="submit" [disabled]="registerForm.invalid || isRegisterSubmitting()">
          <span>{{ isRegisterSubmitting() ? '注册中...' : '注册' }}</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>
      </form>

    </div>

    <div class="reset-layer" [class.is-open]="isResetOpen()" aria-hidden="{{ !isResetOpen() }}">
      <div class="register-copy">
        <span>RESET</span>
        <h2>找回密码</h2>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="submitReset()" novalidate>
        <label class="field-control">
          邮箱
          <input formControlName="email" type="email" autocomplete="email" placeholder="注册邮箱" />
          @if (resetForm.controls.email.touched && resetForm.controls.email.invalid) {
            <span class="field-error">请输入有效邮箱。</span>
          }
        </label>

        <label class="field-control captcha-control">
          邮箱验证码
          <span class="captcha-field">
            <input formControlName="captcha" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" />
            <button type="button" (click)="sendResetCaptcha()" [disabled]="isSendingResetCaptcha()">
              {{ isSendingResetCaptcha() ? '发送中...' : '发送验证码' }}
            </button>
          </span>
          @if (resetForm.controls.captcha.touched && resetForm.controls.captcha.invalid) {
            <span class="field-error">请输入 6 位验证码。</span>
          }
        </label>

        <label class="field-control">
          新密码
          <input formControlName="password" type="password" autocomplete="new-password" placeholder="至少 6 位密码" />
          @if (resetForm.controls.password.touched && resetForm.controls.password.invalid) {
            <span class="field-error">密码至少需要 6 位。</span>
          }
        </label>

        <button class="submit-button register-submit" type="submit" [disabled]="resetForm.invalid || isResetSubmitting()">
          <span>{{ isResetSubmitting() ? '重置中...' : '重置密码' }}</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>
      </form>
    </div>
  </section>
</section>
