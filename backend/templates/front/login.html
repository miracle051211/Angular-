{% extends 'front/base.html' %}

{% block title %}
  学习小洞天-登录
{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static',filename='front/css/sign.css') }}">
<script src="{{ url_for('static',filename='front/js/snow.js') }}"></script>
{% endblock %}

{% block body %}
<div class="container-fluid p-0 login-container">
  <div class="row no-gutters login-row">
    <!-- 左侧轮播图列 -->
    <div class="col-md-6">
      <div id="loginCarousel" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
          <li data-target="#loginCarousel" data-slide-to="0" class="active"></li>
          <li data-target="#loginCarousel" data-slide-to="1"></li>
          <li data-target="#loginCarousel" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
          
          <div class="carousel-item active">
            <img src="{{ url_for('static',filename='images/lunbo/lun1.jpg') }}" class="d-block w-100" alt="轮播图1">
          </div>
          <div class="carousel-item">
            <img src="{{ url_for('static',filename='images/lunbo/lun2.jpg') }}" class="d-block w-100" alt="轮播图2">
          </div>

          <div class="carousel-item">
            <img src="{{ url_for('static',filename='images/lunbo/lun4.jpg') }}" class="d-block w-100" alt="轮播图3">
          </div>
        </div>
        <a class="carousel-control-prev" href="#loginCarousel" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#loginCarousel" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>
      </div>
    </div>
    
    <!-- 右侧登录表单列 -->
    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div class="sign-box">
        <form action="{{ url_for('user.login') }}" method="post">
          <input type="hidden" name = "csrf_token" value = "{{ csrf_token() }}">

          <div class="subscribe">
            <p>LOGIN</p>
            <input placeholder="Your e-mail" class="subscribe-input" name="email" type="email">
            <input placeholder="Your password" class="subscribe-input" name="password" type="password">


            <div class="form-group" style="margin-left: 7px;margin-top: 5px;">
              <a href="{{ url_for('user.register') }}" class="a1" style="margin-right: 5px;"> 注册</a>
              <a href="{{ url_for('user.find_password') }}" class="a1">找回密码</a>
            </div>



            <button class="submit-btn" id="submit-btn">SUBMIT</button>

        </div>

      </form>
      
      <!-- 温馨提示 -->
      <div class="warm-tips">
        <h5>温馨提示：</h5>
        <ul>
          <li>请确保您的账户信息安全，不要与他人共享</li>
          <li>建议使用强密码，包含字母、数字和特殊字符</li>
          <li>如遇到登录问题，请联系管理员</li>
          <li>建议使用最新版本的浏览器以获得最佳体验</li>
        </ul>
      </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
