{% extends 'front/base.html' %}

{% block title %}
  发送私信
{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ url_for('static',filename='front/css/notifications.css') }}">
{% endblock %}

{% block body %}
  <div class="lg-container">
    <div class="notification-card">
      <div class="notification-header">
        <h2 class="page-title">发送私信</h2>
      </div>
      <form class="send-message-form" action="{{ url_for('user.send_message') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label for="receiver">收件人</label>
          <select class="form-control" id="receiver" name="receiver_id" required>
            {% if receiver %}
              <option value="{{ receiver.id }}">{{ receiver.username }}</option>
            {% else %}
              <option value="">请选择收件人</option>
            {% endif %}
            {% for user in users %}
              {% if user.id != g.user.id %}
                <option value="{{ user.id }}" {% if receiver and receiver.id == user.id %}selected{% endif %}>{{ user.username }}</option>
              {% endif %}
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="content">消息内容</label>
          <textarea class="form-control" id="content" name="content" rows="5" placeholder="请输入消息内容..." required></textarea>
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn-primary">发送消息</button>
          <a href="{{ url_for('user.messages') }}" class="btn btn-default">取消</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
