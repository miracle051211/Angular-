{% extends 'front/base.html' %}

{% block title %}
  找回密码
{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static',filename='front/css/sign.css') }}">
<script src="{{ url_for('static', filename = 'front/js/password.js') }}"></script>
{% endblock %}

{% block body %}
<div class="container-fluid p-0 password-container">
  <div class="row no-gutters password-row">
    <!-- 左侧轮播图列 -->
    <div class="col-md-6">
      <div id="passwordCarousel" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
          <li data-target="#passwordCarousel" data-slide-to="0" class="active"></li>
          <li data-target="#passwordCarousel" data-slide-to="1"></li>
          <li data-target="#passwordCarousel" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="{{ url_for('static',filename='images/lunbo/lun1.jpg') }}" class="d-block w-100" alt="轮播图1">
          </div>
          <div class="carousel-item">
            <img src="{{ url_for('static',filename='images/lunbo/lun2.jpg') }}" class="d-block w-100" alt="轮播图2">
          </div>
          <div class="carousel-item">
            <img src="{{ url_for('static',filename='images/lunbo/lun4.jpg') }}" class="d-block w-100" alt="轮播图3">
          </div>
        </div>
        <a class="carousel-control-prev" href="#passwordCarousel" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#passwordCarousel" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>
      </div>
    </div>
    
    <!-- 右侧找回密码表单列 -->
    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div class="sign-box">
        <form action="{{ url_for('user.find_password') }}" method="post">
          <input type="hidden" name = "csrf_token" value = "{{ csrf_token() }}">

          <div class="subscribe">
            <p>PASSWORD BACK</p>
            <input type="text" class="subscribe-input" name="email" placeholder="E-mail">
            <button class="animated-button input-group-append" id="captcha-btn">
              <span>Send captcha</span>
              <span></span>
            </button> 
            <input type="text" class="subscribe-input" name="email_captcha" placeholder="captcha">
            <input placeholder="New password" class="subscribe-input" name="password" type="password">
            <input type="password" class="subscribe-input" name="confirm_password" placeholder="Confirm password">
            
            <div class="form-group" style="margin-left: 7px;">
              <a href="{{ url_for('user.login') }}" class="a1" style="margin-right: 5px;"> 返回登录</a>
              <a href="{{ url_for('user.register') }}" class="a1"> 立即注册</a>
            </div>


            <button class="submit-btn" id="submit-btn">GO</button>

          </div>

        </form>
        
        <!-- 温馨提示 -->
        <div class="warm-tips">
          <h5>温馨提示：</h5>
          <ul>
            <li>请输入您注册时使用的邮箱地址</li>
            <li>验证码将发送到您的邮箱，请及时查收</li>
            <li>新密码长度至少6位</li>
            <li>请妥善保管新密码</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
