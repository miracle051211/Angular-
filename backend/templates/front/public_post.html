{% extends "front/base.html" %}

{% block title %}
  发布帖子
{% endblock %}

{% block head %}
  <script src="https://cdn.jsdelivr.net/npm/wangeditor@latest/dist/wangEditor.min.js"></script>
  <script src = "{{ url_for('static', filename = 'front/js/public_post.js') }}"></script>
{% endblock %}

{% block body %}
  <h1 style="text-align: center;">发布帖子</h1>

  <div class="mb-4"></div>

  <form action="{{ url_for('post.public_post') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label>标题</label>
      <input type="text" class="form-control" name="title">
    </div>

    <div class="form-group">
      <label>板块</label>
      <select name="board_id" class="form-control">
        {% for board in boards %}
          <option value="{{ board.id }}">{{ board.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label>内容</label>
      <!-- AI工具栏 -->
      <div class="ai-toolbar mb-3">
        <h5>AI辅助创作</h5>
        <div class="btn-group" role="group">
          <button type="button" class="btn btn-primary" id="ai-inspiration">灵感生成</button>
          <button type="button" class="btn btn-primary" id="ai-continue">内容续写</button>
          <button type="button" class="btn btn-primary" id="ai-structure">结构优化</button>
          <button type="button" class="btn btn-primary" id="ai-polish">AI润色</button>
          <button type="button" class="btn btn-primary" id="ai-reply">回复模板</button>
        </div>
      </div>
      
      <!-- AI结果展示区域 -->
      <div id="ai-result" class="alert alert-info mt-3" style="display: none;">
        <div class="d-flex justify-content-between">
          <h6>AI结果</h6>
          <button type="button" class="close" id="close-ai-result">&times;</button>
        </div>
        <div id="ai-result-content"></div>
        <button type="button" class="btn btn-sm btn-success mt-2" id="insert-ai-result">插入到编辑器</button>
      </div>
      
      <!-- AI加载提示 -->
      <div id="ai-loading" class="alert alert-secondary mt-3" style="display: none;">
        <div class="d-flex align-items-center">
          <span class="spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span>
          <span>AI正在生成内容，请稍候...</span>
        </div>
      </div>
      
      <!-- 为编辑器容器添加唯一的class -->
      <div class="my-wang-editor">
        <div id="editor"></div>
      </div>
    </div>

    <div class="form-group">
      <button class="btn btn-success" id="submit-btn">发布帖子</button>
    </div>

  </form>
{% endblock %}
