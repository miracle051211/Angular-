<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Waves</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #f40c3f;
    }

    a-waves {
      --x: -0.5rem;
      --y: 50%;

      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    a-waves::before {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #160000;
      transform: translate3d(calc(var(--x) - 50%), calc(var(--y) - 50%), 0);
      content: "";
      will-change: transform;
      pointer-events: none;
    }

    a-waves svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    a-waves svg path {
      fill: none;
      stroke: #160000;
      stroke-width: 1px;
    }
  </style>
</head>
<body>
  <a-waves>
    <svg class="js-svg" aria-hidden="true"></svg>
  </a-waves>

  <script>
    class Noise {
      constructor(seed = Math.random()) {
        this.p = new Uint8Array(512);
        this.permutation = new Uint8Array(256);
        this.seed(seed);
      }

      seed(seed) {
        let value = Math.floor(seed * 65536);

        if (seed > 1) {
          value = Math.floor(seed);
        }

        for (let i = 0; i < 256; i += 1) {
          let v;

          if (i & 1) {
            v = i ^ (value & 255);
          } else {
            v = i ^ ((value >> 8) & 255);
          }

          this.permutation[i] = v;
          this.p[i] = v;
          this.p[i + 256] = v;
        }
      }

      fade(t) {
        return t * t * t * (t * (t * 6 - 15) + 10);
      }

      lerp(t, a, b) {
        return a + t * (b - a);
      }

      grad(hash, x, y) {
        const h = hash & 3;
        const u = h < 2 ? x : y;
        const v = h < 2 ? y : x;

        return ((h & 1) ? -u : u) + ((h & 2) ? -2 * v : 2 * v);
      }

      perlin2(x, y) {
        const xFloor = Math.floor(x);
        const yFloor = Math.floor(y);
        const xUnit = x - xFloor;
        const yUnit = y - yFloor;
        const xIndex = xFloor & 255;
        const yIndex = yFloor & 255;
        const u = this.fade(xUnit);
        const v = this.fade(yUnit);
        const p = this.p;

        const aa = p[xIndex + p[yIndex]];
        const ab = p[xIndex + p[yIndex + 1]];
        const ba = p[xIndex + 1 + p[yIndex]];
        const bb = p[xIndex + 1 + p[yIndex + 1]];

        return this.lerp(
          v,
          this.lerp(u, this.grad(aa, xUnit, yUnit), this.grad(ba, xUnit - 1, yUnit)),
          this.lerp(u, this.grad(ab, xUnit, yUnit - 1), this.grad(bb, xUnit - 1, yUnit - 1))
        );
      }
    }

    class AWaves extends HTMLElement {
      connectedCallback() {
        this.svg = this.querySelector(".js-svg");

        this.mouse = {
          x: -10,
          y: 0,
          lx: 0,
          ly: 0,
          sx: 0,
          sy: 0,
          v: 0,
          vs: 0,
          a: 0,
          set: false,
        };

        this.lines = [];
        this.paths = [];
        this.noise = new Noise(Math.random());

        this.onResize = this.onResize.bind(this);
        this.onMouseMove = this.onMouseMove.bind(this);
        this.onTouchMove = this.onTouchMove.bind(this);
        this.tick = this.tick.bind(this);

        this.setSize();
        this.setLines();
        this.bindEvents();

        this.animationFrame = requestAnimationFrame(this.tick);
      }

      disconnectedCallback() {
        window.removeEventListener("resize", this.onResize);
        window.removeEventListener("mousemove", this.onMouseMove);
        this.removeEventListener("touchmove", this.onTouchMove);
        cancelAnimationFrame(this.animationFrame);
      }

      bindEvents() {
        window.addEventListener("resize", this.onResize);
        window.addEventListener("mousemove", this.onMouseMove);
        this.addEventListener("touchmove", this.onTouchMove, { passive: false });
      }

      onResize() {
        this.setSize();
        this.setLines();
      }

      onMouseMove(event) {
        this.updateMousePosition(event.clientX, event.clientY);
      }

      onTouchMove(event) {
        event.preventDefault();

        const touch = event.touches[0];
        this.updateMousePosition(touch.clientX, touch.clientY);
      }

      updateMousePosition(x, y) {
        const { mouse } = this;

        mouse.x = x - this.bounding.left;
        mouse.y = y - this.bounding.top;

        if (!mouse.set) {
          mouse.sx = mouse.x;
          mouse.sy = mouse.y;
          mouse.lx = mouse.x;
          mouse.ly = mouse.y;
          mouse.set = true;
        }
      }

      setSize() {
        this.bounding = this.getBoundingClientRect();
        this.svg.setAttribute("viewBox", `0 0 ${this.bounding.width} ${this.bounding.height}`);
        this.svg.setAttribute("width", this.bounding.width);
        this.svg.setAttribute("height", this.bounding.height);
      }

      setLines() {
        const { width, height } = this.bounding;

        this.lines = [];
        this.paths.forEach((path) => path.remove());
        this.paths = [];

        const xGap = 10;
        const yGap = 32;
        const oWidth = width + 200;
        const oHeight = height + 30;
        const totalLines = Math.ceil(oWidth / xGap);
        const totalPoints = Math.ceil(oHeight / yGap);
        const xStart = (width - xGap * totalLines) / 2;
        const yStart = (height - yGap * totalPoints) / 2;

        for (let i = 0; i <= totalLines; i += 1) {
          const points = [];

          for (let j = 0; j <= totalPoints; j += 1) {
            points.push({
              x: xStart + xGap * i,
              y: yStart + yGap * j,
              wave: { x: 0, y: 0 },
              cursor: { x: 0, y: 0, vx: 0, vy: 0 },
            });
          }

          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.classList.add("a__line", "js-line");

          this.svg.appendChild(path);
          this.paths.push(path);
          this.lines.push(points);
        }
      }

      movePoints(time) {
        const { lines, mouse, noise } = this;

        lines.forEach((points) => {
          points.forEach((point) => {
            const move = noise.perlin2(
              (point.x + time * 0.0125) * 0.002,
              (point.y + time * 0.005) * 0.0015
            ) * 12;

            point.wave.x = Math.cos(move) * 32;
            point.wave.y = Math.sin(move) * 16;

            const dx = point.x - mouse.sx;
            const dy = point.y - mouse.sy;
            const distance = Math.hypot(dx, dy);
            const limit = Math.max(175, mouse.vs);

            if (distance < limit) {
              const strength = 1 - distance / limit;
              const force = Math.cos(distance * 0.001) * strength;

              point.cursor.vx += Math.cos(mouse.a) * force * limit * mouse.vs * 0.00065;
              point.cursor.vy += Math.sin(mouse.a) * force * limit * mouse.vs * 0.00065;
            }

            point.cursor.vx += (0 - point.cursor.x) * 0.005;
            point.cursor.vy += (0 - point.cursor.y) * 0.005;
            point.cursor.vx *= 0.925;
            point.cursor.vy *= 0.925;
            point.cursor.x += point.cursor.vx * 2;
            point.cursor.y += point.cursor.vy * 2;
            point.cursor.x = Math.min(100, Math.max(-100, point.cursor.x));
            point.cursor.y = Math.min(100, Math.max(-100, point.cursor.y));
          });
        });
      }

      moved(point, withCursorForce = true) {
        const coords = {
          x: point.x + point.wave.x + (withCursorForce ? point.cursor.x : 0),
          y: point.y + point.wave.y + (withCursorForce ? point.cursor.y : 0),
        };

        coords.x = Math.round(coords.x * 10) / 10;
        coords.y = Math.round(coords.y * 10) / 10;

        return coords;
      }

      drawLines() {
        const { lines, paths } = this;

        lines.forEach((points, lineIndex) => {
          const firstPoint = this.moved(points[0], false);
          let d = `M ${firstPoint.x} ${firstPoint.y}`;

          points.forEach((point, pointIndex) => {
            const isLast = pointIndex === points.length - 1;
            const movedPoint = this.moved(point, !isLast);
            d += ` L ${movedPoint.x} ${movedPoint.y}`;
          });

          paths[lineIndex].setAttribute("d", d);
        });
      }

      tick(time) {
        const { mouse } = this;

        mouse.sx += (mouse.x - mouse.sx) * 0.1;
        mouse.sy += (mouse.y - mouse.sy) * 0.1;

        const dx = mouse.x - mouse.lx;
        const dy = mouse.y - mouse.ly;
        const distance = Math.hypot(dx, dy);

        mouse.v = distance;
        mouse.vs += (distance - mouse.vs) * 0.1;
        mouse.vs = Math.min(100, mouse.vs);
        mouse.lx = mouse.x;
        mouse.ly = mouse.y;
        mouse.a = Math.atan2(dy, dx);

        this.style.setProperty("--x", `${mouse.sx}px`);
        this.style.setProperty("--y", `${mouse.sy}px`);

        this.movePoints(time);
        this.drawLines();

        this.animationFrame = requestAnimationFrame(this.tick);
      }
    }

    customElements.define("a-waves", AWaves);
  </script>
</body>
</html>
